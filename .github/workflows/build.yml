name: Build GrowTracker APK v2
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Project Files
        run: |
          rm -rf app src build.gradle.kts settings.gradle.kts gradle.properties GrowTracker.zip
          mkdir -p app/src/main/java/com/growtracker/app/data
          mkdir -p app/src/main/java/com/growtracker/app/navigation
          mkdir -p app/src/main/java/com/growtracker/app/ui/theme
          mkdir -p app/src/main/java/com/growtracker/app/ui/screens
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GrowTracker"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("com.google.devtools.ksp") version "2.0.21-1.0.28" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }
          android {
              namespace = "com.growtracker.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.growtracker.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.navigation:navigation-compose:2.8.5")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              ksp("androidx.room:room-compiler:2.6.1")
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.3")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application
                  android:allowBackup="false"
                  android:label="GrowTracker"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.GrowTracker">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.GrowTracker">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">GrowTracker</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.GrowTracker" parent="android:Theme.Material.NoActionBar" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/MainActivity.kt
          package com.growtracker.app
          import android.graphics.Color
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.SystemBarStyle
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import com.growtracker.app.navigation.AppNavigation
          import com.growtracker.app.ui.theme.GrowTrackerTheme
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge(
                      statusBarStyle = SystemBarStyle.dark(Color.TRANSPARENT),
                      navigationBarStyle = SystemBarStyle.dark(Color.TRANSPARENT)
                  )
                  setContent {
                      GrowTrackerTheme {
                          AppNavigation()
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/data/Entities.kt
          package com.growtracker.app.data
          import androidx.room.Entity
          import androidx.room.PrimaryKey
          @Entity(tableName = "plants")
          data class Plant(
              @PrimaryKey val id: String,
              val name: String,
              val genetics: String,
              val flipDate: String,
              val colorHex: String
          )
          @Entity(tableName = "events")
          data class Event(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val plantId: String,
              val type: String,
              val dateTime: String,
              val inPpm: Int?,
              val outPpm: Int?,
              val volumeL: Double?,
              val note: String?
          ) {
              val delta: Int? get() = if (inPpm != null && outPpm != null) outPpm - inPpm else null
          }
          @Entity(tableName = "settings")
          data class Setting(
              @PrimaryKey val key: String,
              val value: String
          )
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/data/GrowDao.kt
          package com.growtracker.app.data
          import androidx.room.Dao
          import androidx.room.Insert
          import androidx.room.Query
          import kotlinx.coroutines.flow.Flow
          @Dao
          interface GrowDao {
              @Query("SELECT * FROM plants")
              fun getPlants(): Flow<List<Plant>>
              @Query("SELECT * FROM events ORDER BY dateTime DESC")
              fun getEvents(): Flow<List<Event>>
              @Insert
              suspend fun insertPlant(plant: Plant)
              @Insert
              suspend fun insertEvent(event: Event)
              @Query("SELECT * FROM settings WHERE key = 'seed_imported'")
              suspend fun getSeedFlag(): Setting?
              @Insert
              suspend fun insertSetting(setting: Setting)
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/data/AppDatabase.kt
          package com.growtracker.app.data
          import android.content.Context
          import androidx.room.Database
          import androidx.room.Room
          import androidx.room.RoomDatabase
          @Database(entities = [Plant::class, Event::class, Setting::class], version = 1, exportSchema = false)
          abstract class AppDatabase : RoomDatabase() {
              abstract fun growDao(): GrowDao
              companion object {
                  @Volatile private var INSTANCE: AppDatabase? = null
                  fun getDatabase(context: Context): AppDatabase {
                      return INSTANCE ?: synchronized(this) {
                          val instance = Room.databaseBuilder(
                              context.applicationContext,
                              AppDatabase::class.java,
                              "growtracker.db"
                          ).build()
                          INSTANCE = instance
                          instance
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/data/SeedData.kt
          package com.growtracker.app.data
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          object SeedData {
              suspend fun populate(db: AppDatabase) = withContext(Dispatchers.IO) {
                  val dao = db.growDao()
                  if (dao.getSeedFlag() != null) return@withContext
                  val big = Plant("plant_big", "Большой", "Сатива", "2026-10-04", "#B4F000")
                  val small = Plant("plant_small", "Малый", "Индика", "2026-10-06", "#8B7BF7")
                  dao.insertPlant(big)
                  dao.insertPlant(small)
                  dao.insertEvent(Event(plantId="plant_small", type="water", dateTime="2026-09-15T10:00:00", inPpm=null, outPpm=null, volumeL=2.0, note="Перелив. Начал чахнуть."))
                  dao.insertEvent(Event(plantId="plant_big", type="water", dateTime="2026-09-17T10:00:00", inPpm=620, outPpm=920, volumeL=2.0, note="TriPart + CalMag + Taste"))
                  dao.insertEvent(Event(plantId="plant_small", type="water", dateTime="2026-09-22T10:00:00", inPpm=449, outPpm=742, volumeL=1.0, note="TriPart + Taste"))
                  dao.insertEvent(Event(plantId="plant_big", type="flip", dateTime="2026-10-04T10:00:00", inPpm=null, outPpm=null, volumeL=null, note="Перевод на 12/12"))
                  dao.insertEvent(Event(plantId="plant_small", type="flip", dateTime="2026-10-06T10:00:00", inPpm=null, outPpm=null, volumeL=null, note="Перевод на 12/12"))
                  dao.insertEvent(Event(plantId="plant_big", type="water", dateTime="2026-11-15T10:00:00", inPpm=460, outPpm=920, volumeL=2.0, note="TriPart + Atami (1.4 л + 0.6 л)"))
                  dao.insertEvent(Event(plantId="plant_big", type="flush", dateTime="2026-11-19T10:00:00", inPpm=170, outPpm=830, volumeL=2.0, note="Промывка 1"))
                  dao.insertEvent(Event(plantId="plant_small", type="feed", dateTime="2026-11-22T10:00:00", inPpm=676, outPpm=749, volumeL=1.5, note="TriPart + Delta 9, pH 6.5"))
                  dao.insertSetting(Setting("seed_imported", "true"))
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/ui/MainViewModel.kt
          package com.growtracker.app.ui
          import android.app.Application
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import com.growtracker.app.data.AppDatabase
          import com.growtracker.app.data.SeedData
          import kotlinx.coroutines.flow.SharingStarted
          import kotlinx.coroutines.flow.stateIn
          import kotlinx.coroutines.launch
          class MainViewModel(app: Application) : AndroidViewModel(app) {
              private val db = AppDatabase.getDatabase(app)
              private val dao = db.growDao()
              val plants = dao.getPlants().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
              val events = dao.getEvents().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
              init {
                  viewModelScope.launch { SeedData.populate(db) }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/ui/theme/Color.kt
          package com.growtracker.app.ui.theme
          import androidx.compose.ui.graphics.Color
