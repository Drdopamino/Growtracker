          package com.growtracker.app.ui.screens
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.collectAsState
          import androidx.compose.runtime.getValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.unit.dp
          import com.growtracker.app.ui.MainViewModel
          import com.growtracker.app.ui.theme.*
          @Composable
          fun ChartsScreen(viewModel: MainViewModel) {
              val events by viewModel.events.collectAsState()
              val data = events.filter { it.inPpm != null && it.outPpm != null }.reversed()
              Column(modifier = Modifier.fillMaxSize().padding(20.dp)) {
                  Text("ГРАФИКИ", style = MaterialTheme.typography.displayLarge, color = Lime)
                  Spacer(Modifier.height(24.dp))
                  if (data.isNotEmpty()) {
                      val maxPpm = data.maxOf { maxOf(it.inPpm!!, it.outPpm!!) }.coerceAtLeast(500)
                      Canvas(modifier = Modifier.fillMaxWidth().height(300.dp)) {
                          val stepX = size.width / (data.size.coerceAtLeast(2) - 1)
                          val inPath = Path()
                          val outPath = Path()
                          data.forEachIndexed { i, ev ->
                              val x = i * stepX
                              val yIn = size.height - (ev.inPpm!!.toFloat() / maxPpm) * size.height
                              val yOut = size.height - (ev.outPpm!!.toFloat() / maxPpm) * size.height
                              if (i == 0) { inPath.moveTo(x, yIn); outPath.moveTo(x, yOut) }
                              else { inPath.lineTo(x, yIn); outPath.lineTo(x, yOut) }
                          }
                          drawPath(inPath, color = Lime, style = Stroke(width = 4f))
                          drawPath(outPath, color = Red, style = Stroke(width = 4f))
                      }
                      Spacer(Modifier.height(16.dp))
                      Row(horizontalArrangement = Arrangement.spacedBy(16.dp)) {
                          Text("— Вход (PPM)", color = Lime)
                          Text("— Выход (PPM)", color = Red)
                      }
                  } else {
                      Text("Нет данных для графика", color = TextSecondary)
                  }
              }
          }
          EOF

