          package com.growtracker.app.ui.screens
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.ui.unit.dp
          import com.growtracker.app.data.Event
          import com.growtracker.app.data.Fertilizer
          import com.growtracker.app.data.Plant
          import java.time.LocalDateTime
          import java.time.format.DateTimeFormatter
          @Composable
          fun AddEventDialog(plants: List<Plant>, ferts: List<Fertilizer>, onDismiss: () -> Unit, onSave: (Event, List<Pair<Long, Double>>) -> Unit) {
              var selectedPlant by remember { mutableStateOf<Plant?>(null) }
              var expanded by remember { mutableStateOf(false) }
              var inPpm by remember { mutableStateOf("") }
              var outPpm by remember { mutableStateOf("") }
              var note by remember { mutableStateOf("") }
              val selectedFerts = remember { mutableStateMapOf<Long, Boolean>() }

              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("ДОБАВИТЬ СОБЫТИЕ") },
                  text = {
                      Column(Modifier.verticalScroll(rememberScrollState())) {
                          Box {
                              OutlinedButton(onClick = { expanded = true }, modifier = Modifier.fillMaxWidth()) {
                                  Text(selectedPlant?.name ?: "Выбрать растение")
                              }
                              DropdownMenu(expanded = expanded, onDismissRequest = { expanded = false }) {
                                  plants.forEach { p ->
                                      DropdownMenuItem(text = { Text(p.name) }, onClick = { selectedPlant = p; expanded = false })
                                  }
                              }
                          }
                          Spacer(Modifier.height(8.dp))
                          OutlinedTextField(value = inPpm, onValueChange = { inPpm = it }, label = { Text("Вход PPM") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number), modifier = Modifier.fillMaxWidth())
                          Spacer(Modifier.height(8.dp))
                          OutlinedTextField(value = outPpm, onValueChange = { outPpm = it }, label = { Text("Выход PPM") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number), modifier = Modifier.fillMaxWidth())
                          Spacer(Modifier.height(8.dp))
                          OutlinedTextField(value = note, onValueChange = { note = it }, label = { Text("Заметка") }, modifier = Modifier.fillMaxWidth())
                          Spacer(Modifier.height(16.dp))
                          Text("Удобрения:", style = MaterialTheme.typography.titleLarge)
                          ferts.forEach { f ->
                              Row(Modifier.fillMaxWidth().clickable { selectedFerts[f.id] = !(selectedFerts[f.id] ?: false) }, verticalAlignment = androidx.compose.ui.Alignment.CenterVertically) {
                                  Checkbox(checked = selectedFerts[f.id] ?: false, onCheckedChange = { selectedFerts[f.id] = it })
                                  Text(f.name)
                              }
                          }
                      }
                  },
                  confirmButton = {
                      Button(onClick = {
                          if (selectedPlant != null) {
                              val now = LocalDateTime.now().format(DateTimeFormatter.ISO_LOCAL_DATE_TIME)
                              val ev = Event(plantId = selectedPlant!!.id, type = "water", dateTime = now, inPpm = inPpm.toIntOrNull(), outPpm = outPpm.toIntOrNull(), volumeL = 1.0, note = note)
                              val fertList = selectedFerts.filter { it.value }.map { it.key to 1.0 }
                              onSave(ev, fertList)
                          }
                      }) { Text("Сохранить") }
                  },
                  dismissButton = { TextButton(onClick = onDismiss) { Text("Отмена") } }
              )
          }
          EOF

