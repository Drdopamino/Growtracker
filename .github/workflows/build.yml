          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/navigation/AppNavigation.kt
          package com.growtracker.app.navigation
          import androidx.compose.foundation.layout.padding
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.outlined.BarChart
          import androidx.compose.material.icons.outlined.CalendarToday
          import androidx.compose.material.icons.outlined.Home
          import androidx.compose.material.icons.outlined.List
          import androidx.compose.material.icons.outlined.Settings
          import androidx.compose.material3.Icon
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.NavigationBar
          import androidx.compose.material3.NavigationBarItem
          import androidx.compose.material3.NavigationBarItemDefaults
          import androidx.compose.material3.Scaffold
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.lifecycle.viewmodel.compose.viewModel
          import androidx.navigation.NavDestination.Companion.hierarchy
          import androidx.navigation.NavGraph.Companion.findStartDestination
          import androidx.navigation.compose.NavHost
          import androidx.navigation.compose.composable
          import androidx.navigation.compose.currentBackStackEntryAsState
          import androidx.navigation.compose.rememberNavController
          import com.growtracker.app.ui.MainViewModel
          import com.growtracker.app.ui.screens.*
          import com.growtracker.app.ui.theme.Lime
          import com.growtracker.app.ui.theme.OnLime
          sealed class Screen(val route: String, val label: String, val icon: ImageVector) {
              data object Home : Screen("home", "Главная", Icons.Outlined.Home)
              data object Journal : Screen("journal", "Журнал", Icons.Outlined.List)
              data object Calendar : Screen("calendar", "Календарь", Icons.Outlined.CalendarToday)
              data object Charts : Screen("charts", "Графики", Icons.Outlined.BarChart)
              data object Menu : Screen("menu", "Меню", Icons.Outlined.Settings)
          }
          @Composable
          fun AppNavigation() {
              val navController = rememberNavController()
              val items = listOf(Screen.Home, Screen.Journal, Screen.Calendar, Screen.Charts, Screen.Menu)
              val viewModel: MainViewModel = viewModel()
              Scaffold(
                  bottomBar = {
                      NavigationBar(containerColor = MaterialTheme.colorScheme.surface) {
                          val navBackStackEntry by navController.currentBackStackEntryAsState()
                          val currentDestination = navBackStackEntry?.destination
                          items.forEach { screen ->
                              NavigationBarItem(
                                  icon = { Icon(screen.icon, contentDescription = screen.label) },
                                  label = { Text(screen.label) },
                                  selected = currentDestination?.hierarchy?.any { it.route == screen.route } == true,
                                  onClick = {
                                      navController.navigate(screen.route) {
                                          popUpTo(navController.graph.findStartDestination().id) { saveState = true }
                                          launchSingleTop = true
                                          restoreState = true
                                      }
                                  },
                                  colors = NavigationBarItemDefaults.colors(
                                      selectedIconColor = OnLime, selectedTextColor = Lime,
                                      indicatorColor = Lime, unselectedIconColor = MaterialTheme.colorScheme.onSurfaceVariant,
                                      unselectedTextColor = MaterialTheme.colorScheme.onSurfaceVariant
                                  )
                              )
                          }
                      }
                  }
              ) { innerPadding ->
                  NavHost(navController = navController, startDestination = Screen.Home.route, modifier = Modifier.padding(innerPadding)) {
                      composable(Screen.Home.route) { HomeScreen(viewModel) }
                      composable(Screen.Journal.route) { JournalScreen(viewModel) }
                      composable(Screen.Calendar.route) { CalendarScreen() }
                      composable(Screen.Charts.route) { ChartsScreen() }
                      composable(Screen.Menu.route) { MenuScreen() }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/ui/screens/HomeScreen.kt
          package com.growtracker.app.ui.screens
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.collectAsState
          import androidx.compose.runtime.getValue
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.StrokeCap
          import androidx.compose.ui.graphics.drawscope.Stroke as DrawStroke
          import androidx.compose.ui.unit.dp
          import com.growtracker.app.ui.MainViewModel
          import com.growtracker.app.ui.theme.*
          import java.time.LocalDate
          import java.time.temporal.ChronoUnit
          @Composable
          fun HomeScreen(viewModel: MainViewModel) {
              val plants by viewModel.plants.collectAsState()
              val events by viewModel.events.collectAsState()
              Column(modifier = Modifier.fillMaxSize().padding(20.dp)) {
                  Text("ГЛАВНАЯ", style = MaterialTheme.typography.displayLarge, color = Lime)
                  Spacer(Modifier.height(16.dp))
                  val lastEvent = events.firstOrNull { it.plantId == "plant_big" }
                  val lastDelta = lastEvent?.delta
                  if (lastEvent != null && lastDelta != null) {
                      val deltaColor = when {
                          lastDelta > 300 || (lastEvent.outPpm ?: 0) >= 800 -> Red
                          lastDelta > 250 -> Yellow
                          else -> Green
                      }
                      Column(Modifier.fillMaxWidth().background(deltaColor, RoundedCornerShape(20.dp)).padding(16.dp)) {
                          Text("ДЕЛЬТА ПОСЛЕДНЕГО ПОЛИВА (БОЛЬШОЙ)", style = MaterialTheme.typography.labelSmall, color = OnLime)
                          Spacer(Modifier.height(4.dp))
                          Text("+${lastDelta} PPM", style = MaterialTheme.typography.headlineLarge, color = OnLime)
                          Text("Вход: ${lastEvent.inPpm} → Выход: ${lastEvent.outPpm}", style = MaterialTheme.typography.bodyMedium, color = OnLime)
                      }
                      Spacer(Modifier.height(16.dp))
                  }
                  Text("РАСТЕНИЯ", style = MaterialTheme.typography.headlineMedium, color = TextPrimary)
                  Spacer(Modifier.height(8.dp))
                  LazyRow(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                      items(plants) { plant ->
                          Column(Modifier.width(160.dp).background(Surface, RoundedCornerShape(20.dp)).border(1.dp, Stroke, RoundedCornerShape(20.dp)).padding(16.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                              val today = LocalDate.now()
                              val flip = LocalDate.parse(plant.flipDate)
                              val daysInFlower = ChronoUnit.DAYS.between(flip, today).toInt().coerceAtLeast(0)
                              val progress = (daysInFlower.toFloat() / 84).coerceIn(0f, 1f)
                              Box(contentAlignment = Alignment.Center, modifier = Modifier.size(100.dp)) {
                                  Canvas(modifier = Modifier.size(100.dp)) {
                                      drawArc(color = Color(android.graphics.Color.parseColor(plant.colorHex)).copy(alpha = 0.2f), startAngle = -90f, sweepAngle = 360f, useCenter = false, style = DrawStroke(width = 8.dp.toPx(), cap = StrokeCap.Round))
                                      drawArc(color = Color(android.graphics.Color.parseColor(plant.colorHex)), startAngle = -90f, sweepAngle = 360f * progress, useCenter = false, style = DrawStroke(width = 8.dp.toPx(), cap = StrokeCap.Round))
                                  }
                                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                      Text("День", style = MaterialTheme.typography.labelSmall, color = TextSecondary)
                                      Text("$daysInFlower", style = MaterialTheme.typography.headlineMedium, color = TextPrimary)
                                  }
                              }
                              Spacer(Modifier.height(12.dp))
                              Text(plant.name, style = MaterialTheme.typography.titleLarge, color = TextPrimary)
                              Text(plant.genetics, style = MaterialTheme.typography.bodyMedium, color = TextSecondary)
                          }
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/ui/screens/JournalScreen.kt
          package com.growtracker.app.ui.screens
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.collectAsState
          import androidx.compose.runtime.getValue
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import com.growtracker.app.ui.MainViewModel
          import com.growtracker.app.ui.theme.*
          import java.time.LocalDateTime
          import java.time.format.DateTimeFormatter
          @Composable
          fun JournalScreen(viewModel: MainViewModel) {
              val events by viewModel.events.collectAsState()
              val formatter = DateTimeFormatter.ofPattern("dd.MM.yyyy HH:mm")
              Column(modifier = Modifier.fillMaxSize().padding(20.dp)) {
                  Text("ЖУРНАЛ", style = MaterialTheme.typography.displayLarge, color = Lime)
                  Spacer(Modifier.height(16.dp))
                  LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                      items(events) { event ->
                          val delta = event.delta
                          val isError = delta != null && (delta > 300 || (event.outPpm ?: 0) >= 800)
                          Column(Modifier.fillMaxWidth().background(Surface, RoundedCornerShape(16.dp)).border(1.dp, if (isError) Red else Stroke, RoundedCornerShape(16.dp)).padding(16.dp)) {
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Text(
                                      text = when(event.type) { "water" -> "💧 Полив"; "feed" -> "🧪 Компот"; "flush" -> "🚿 Промывка"; "flip" -> "🔄 Флип"; "spray" -> "💨 Опрыскивание"; else -> event.type },
                                      style = MaterialTheme.typography.titleLarge, color = if (isError) Red else TextPrimary
                                  )
                                  Text(event.plantId.replace("plant_", "").replaceFirstChar { it.uppercase() }, color = if (event.plantId == "plant_big") Lime else Purple)
                              }
                              Spacer(Modifier.height(8.dp))
                              Text(LocalDateTime.parse(event.dateTime).format(formatter), style = MaterialTheme.typography.labelSmall, color = TextSecondary)
                              if (event.inPpm != null || event.outPpm != null) {
                                  Spacer(Modifier.height(12.dp))
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Text("PPM: ${event.inPpm ?: "-"} → ${event.outPpm ?: "-"}", style = MaterialTheme.typography.bodyMedium, color = TextSecondary)
                                      if (delta != null) {
                                          Spacer(Modifier.width(12.dp))
                                          val deltaColor = when { delta > 300 || (event.outPpm ?: 0) >= 800 -> Red; delta > 250 -> Yellow; else -> Green }
                                          Text("Δ $delta", modifier = Modifier.background(deltaColor, RoundedCornerShape(4.dp)).padding(horizontal = 6.dp, vertical = 2.dp), style = MaterialTheme.typography.labelSmall, color = OnLime)
                                      }
                                  }
                              }
                              if (!event.note.isNullOrBlank()) {
                                  Spacer(Modifier.height(8.dp))
                                  Text(event.note, style = MaterialTheme.typography.bodyMedium, color = TextPrimary)
                              }
                          }
                      }
                  }
              }
          }
          EOF

