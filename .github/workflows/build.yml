name: Build GrowTracker APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip project
        run: unzip GrowTracker.zip -d ./
        
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          
      - name: Build APK
        run: |
          cd GrowTracker
          gradle assembleDebug
          
      - uses: actions/upload-artifact@v4
        with:
          name: GrowTracker-APK
          path: GrowTracker/app/build/outputs/apk/debug/app-debug.apk
