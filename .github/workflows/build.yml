          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/ui/theme/Theme.kt
          package com.growtracker.app.ui.theme
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          private val DarkColorScheme = darkColorScheme(
              primary = Lime, onPrimary = OnLime, background = Bg, onBackground = TextPrimary,
              surface = Surface, onSurface = TextPrimary, surfaceVariant = Surface2,
              outline = Stroke, error = Red, secondary = Purple, tertiary = Yellow
          )
          @Composable
          fun GrowTrackerTheme(content: @Composable () -> Unit) {
              MaterialTheme(colorScheme = DarkColorScheme, typography = AppTypography) {
                  Box(
                      modifier = Modifier.fillMaxSize()
                          .background(Brush.radialGradient(colors = listOf(BgGlow, Color.Transparent), radius = 800f))
                          .background(Bg)
                  ) { content() }
