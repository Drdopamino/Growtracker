name: Build GrowTracker APK v5
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Project Files
        run: |
          rm -rf app src build.gradle.kts settings.gradle.kts gradle.properties GrowTracker.zip
          mkdir -p app/src/main/java/com/growtracker/app/data
          mkdir -p app/src/main/java/com/growtracker/app/navigation
          mkdir -p app/src/main/java/com/growtracker/app/ui/theme
          mkdir -p app/src/main/java/com/growtracker/app/ui/screens
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GrowTracker"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("com.google.devtools.ksp") version "2.0.21-1.0.28" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }
          android {
              namespace = "com.growtracker.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.growtracker.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 5
                  versionName = "5.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.navigation:navigation-compose:2.8.5")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              ksp("androidx.room:room-compiler:2.6.1")
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.3")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="false" android:label="GrowTracker" android:supportsRtl="true" android:theme="@style/Theme.GrowTracker">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">GrowTracker</string></resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources><style name="Theme.GrowTracker" parent="android:Theme.Material.NoActionBar" /></resources>
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/MainActivity.kt
          package com.growtracker.app
          import android.graphics.Color
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.SystemBarStyle
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import com.growtracker.app.navigation.AppNavigation
          import com.growtracker.app.ui.theme.GrowTrackerTheme
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge(statusBarStyle = SystemBarStyle.dark(Color.TRANSPARENT), navigationBarStyle = SystemBarStyle.dark(Color.TRANSPARENT))
                  setContent { GrowTrackerTheme { AppNavigation() } }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/data/Entities.kt
          package com.growtracker.app.data
          import androidx.room.Entity
          import androidx.room.PrimaryKey
          @Entity(tableName = "plants")
          data class Plant(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val name: String,
              val genetics: String,
              val potLiters: Double,
              val flipDate: String,
              val colorHex: String
          )
          @Entity(tableName = "fertilizers")
          data class Fertilizer(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val name: String,
              val category: String,
              val defaultDose: Double
          )
          @Entity(tableName = "events")
          data class Event(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val plantId: Long,
              val type: String,
              val dateTime: String,
              val inPpm: Int?,
              val outPpm: Int?,
              val volumeL: Double?,
              val note: String?
          ) { val delta: Int? get() = if (inPpm != null && outPpm != null) outPpm - inPpm else null }
          @Entity(tableName = "event_fertilizers", primaryKeys = ["eventId", "fertilizerId"])
          data class EventFertilizer(
              val eventId: Long,
              val fertilizerId: Long,
              val dose: Double
          )
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/data/GrowDao.kt
          package com.growtracker.app.data
          import androidx.room.*
          import kotlinx.coroutines.flow.Flow
          @Dao
          interface GrowDao {
              @Query("SELECT * FROM plants") fun getPlants(): Flow<List<Plant>>
              @Query("SELECT * FROM fertilizers") fun getFertilizers(): Flow<List<Fertilizer>>
              @Query("SELECT * FROM events ORDER BY dateTime DESC") fun getEvents(): Flow<List<Event>>
              @Query("SELECT * FROM event_fertilizers WHERE eventId = :eventId") suspend fun getEventFerts(eventId: Long): List<EventFertilizer>
              @Query("SELECT * FROM fertilizers WHERE id = :id") suspend fun getFert(id: Long): Fertilizer?
              @Insert suspend fun insertPlant(plant: Plant): Long
              @Insert suspend fun insertFertilizer(fert: Fertilizer): Long
              @Insert suspend fun insertEvent(event: Event): Long
              @Insert suspend fun insertEventFert(crossRef: EventFertilizer)
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/data/AppDatabase.kt
          package com.growtracker.app.data
          import android.content.Context
          import androidx.room.Database
          import androidx.room.Room
          import androidx.room.RoomDatabase
          @Database(entities = [Plant::class, Fertilizer::class, Event::class, EventFertilizer::class], version = 1, exportSchema = false)
          abstract class AppDatabase : RoomDatabase() {
              abstract fun growDao(): GrowDao
              companion object {
                  @Volatile private var INSTANCE: AppDatabase? = null
                  fun getDatabase(context: Context): AppDatabase {
                      return INSTANCE ?: synchronized(this) {
                          val instance = Room.databaseBuilder(context.applicationContext, AppDatabase::class.java, "growtracker.db").build()
                          INSTANCE = instance
                          instance
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/data/SeedData.kt
          package com.growtracker.app.data
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          object SeedData {
              suspend fun populate(db: AppDatabase) = withContext(Dispatchers.IO) {
                  val dao = db.growDao()
                  val pBig = dao.insertPlant(Plant(name="Большой", genetics="Сатива", potLiters=15.0, flipDate="2026-10-04", colorHex="#B4F000"))
                  val pSmall = dao.insertPlant(Plant(name="Малый", genetics="Индика", potLiters=10.0, flipDate="2026-10-06", colorHex="#8B7BF7"))
                  
                  dao.insertFertilizer(Fertilizer(name="TriPart Micro", category="База", defaultDose=1.0))
                  dao.insertFertilizer(Fertilizer(name="TriPart Grow", category="База", defaultDose=1.0))
                  dao.insertFertilizer(Fertilizer(name="TriPart Bloom", category="База", defaultDose=1.0))
                  dao.insertFertilizer(Fertilizer(name="Atami B'cuzz", category="Стимуляторы", defaultDose=1.0))
                  dao.insertFertilizer(Fertilizer(name="CalMag", category="Добавки", defaultDose=0.5))
                  dao.insertFertilizer(Fertilizer(name="Delta 9", category="Стимуляторы", defaultDose=1.0))

                  dao.insertEvent(Event(plantId=pSmall, type="water", dateTime="2026-09-15T10:00:00", inPpm=null, outPpm=null, volumeL=2.0, note="Перелив. Начал чахнуть."))
                  dao.insertEvent(Event(plantId=pBig, type="water", dateTime="2026-09-17T10:00:00", inPpm=620, outPpm=920, volumeL=2.0, note="TriPart + CalMag + Taste"))
                  dao.insertEvent(Event(plantId=pBig, type="water", dateTime="2026-11-15T10:00:00", inPpm=460, outPpm=920, volumeL=2.0, note="TriPart + Atami"))
                  dao.insertEvent(Event(plantId=pBig, type="feed", dateTime="2026-11-19T10:00:00", inPpm=170, outPpm=830, volumeL=2.0, note="Промывка"))
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/ui/MainViewModel.kt
          package com.growtracker.app.ui
          import android.app.Application
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import com.growtracker.app.data.*
          import kotlinx.coroutines.flow.SharingStarted
          import kotlinx.coroutines.flow.stateIn
          import kotlinx.coroutines.launch
          class MainViewModel(app: Application) : AndroidViewModel(app) {
              private val dao = AppDatabase.getDatabase(app).growDao()
              val plants = dao.getPlants().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
              val fertilizers = dao.getFertilizers().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
              val events = dao.getEvents().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
              init { viewModelScope.launch { SeedData.populate(AppDatabase.getDatabase(getApplication())) } }
              fun addPlant(plant: Plant) = viewModelScope.launch { dao.insertPlant(plant) }
              fun addFertilizer(fert: Fertilizer) = viewModelScope.launch { dao.insertFertilizer(fert) }
              fun addEvent(event: Event, ferts: List<Pair<Long, Double>>) = viewModelScope.launch {
                  val id = dao.insertEvent(event)
                  ferts.forEach { dao.insertEventFert(EventFertilizer(id, it.first, it.second)) }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/ui/theme/Color.kt
          package com.growtracker.app.ui.theme
          import androidx.compose.ui.graphics.Color
          val Bg = Color(0xFF141414); val BgGlow = Color(0x2EB4F000); val Surface = Color(0xFF1E1E1E)
          val Surface2 = Color(0xFF262626); val Stroke = Color(0xFF333333); val TextPrimary = Color(0xFFFFFFFF)
          val TextSecondary = Color(0xFF8C8C8C); val Lime = Color(0xFFB4F000); val OnLime = Color(0xFF141414)
          val Green = Color(0xFF7ED957); val Yellow = Color(0xFFF7C948); val Purple = Color(0xFF8B7BF7); val Red = Color(0xFFFF5A5A)
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/ui/theme/Type.kt
          package com.growtracker.app.ui.theme
          import androidx.compose.material3.Typography
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.sp
          val AppTypography = Typography(
              displayLarge = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.Black, fontSize = 34.sp),
              headlineMedium = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.Black, fontSize = 22.sp),
              titleLarge = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.SemiBold, fontSize = 20.sp),
              bodyMedium = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.Normal, fontSize = 14.sp),
              labelSmall = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.Medium, fontSize = 12.sp)
          )
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/ui/theme/Theme.kt
          package com.growtracker.app.ui.theme
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          private val DarkColorScheme = darkColorScheme(
              primary = Lime, onPrimary = OnLime, background = Bg, onBackground = TextPrimary,
              surface = Surface, onSurface = TextPrimary, surfaceVariant = Surface2,
              outline = Stroke, error = Red, secondary = Purple, tertiary = Yellow
          )
          @Composable
          fun GrowTrackerTheme(content: @Composable () -> Unit) {
              MaterialTheme(colorScheme = DarkColorScheme, typography = AppTypography) {
                  Box(modifier = Modifier.fillMaxSize().background(Brush.radialGradient(colors = listOf(BgGlow, Color.Transparent), radius = 800f)).background(Bg)) { content() }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/ui/screens/HomeScreen.kt
          package com.growtracker.app.ui.screens
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.collectAsState
          import androidx.compose.runtime.getValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import com.growtracker.app.ui.MainViewModel
          import com.growtracker.app.ui.theme.*
          @Composable
          fun HomeScreen(viewModel: MainViewModel) {
              val plants by viewModel.plants.collectAsState()
              val events by viewModel.events.collectAsState()
              Column(modifier = Modifier.fillMaxSize().padding(20.dp)) {
                  Text("ГЛАВНАЯ", style = MaterialTheme.typography.displayLarge, color = Lime)
                  Spacer(Modifier.height(16.dp))
                  val lastEvent = events.firstOrNull()
                  if (lastEvent?.delta != null) {
                      val dColor = if (lastEvent.delta!! > 300) Red else Green
                      Column(Modifier.fillMaxWidth().background(dColor, RoundedCornerShape(20.dp)).padding(16.dp)) {
                          Text("ДЕЛЬТА ПОСЛЕДНЕГО ПОЛИВА", style = MaterialTheme.typography.labelSmall, color = OnLime)
                          Text("${lastEvent.delta} PPM", style = MaterialTheme.typography.headlineMedium, color = OnLime)
                      }
                      Spacer(Modifier.height(16.dp))
                  }
                  Text("РАСТЕНИЯ", style = MaterialTheme.typography.headlineMedium, color = TextPrimary)
                  Spacer(Modifier.height(8.dp))
                  LazyRow(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                      items(plants) { plant ->
                          Column(Modifier.width(160.dp).background(Surface, RoundedCornerShape(20.dp)).border(1.dp, Stroke, RoundedCornerShape(20.dp)).padding(16.dp)) {
                              Text(plant.name, style = MaterialTheme.typography.titleLarge, color = Color(android.graphics.Color.parseColor(plant.colorHex)))
                              Text(plant.genetics, style = MaterialTheme.typography.bodyMedium, color = TextSecondary)
                              Text("${plant.potLiters} л", style = MaterialTheme.typography.bodyMedium, color = TextSecondary)
                          }
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/ui/screens/JournalScreen.kt
          package com.growtracker.app.ui.screens
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.collectAsState
          import androidx.compose.runtime.getValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import com.growtracker.app.ui.MainViewModel
          import com.growtracker.app.ui.theme.*
          import java.time.LocalDateTime
          import java.time.format.DateTimeFormatter
          @Composable
          fun JournalScreen(viewModel: MainViewModel) {
              val events by viewModel.events.collectAsState()
              val plants by viewModel.plants.collectAsState()
              val formatter = DateTimeFormatter.ofPattern("dd.MM.yyyy HH:mm")
              Column(modifier = Modifier.fillMaxSize().padding(20.dp)) {
                  Text("ЖУРНАЛ", style = MaterialTheme.typography.displayLarge, color = Lime)
                  Spacer(Modifier.height(16.dp))
                  LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                      items(events) { event ->
                          val plant = plants.find { it.id == event.plantId }
                          val d = event.delta
                          val isErr = d != null && (d > 300 || (event.outPpm ?: 0) >= 800)
                          Column(Modifier.fillMaxWidth().background(Surface, RoundedCornerShape(16.dp)).border(1.dp, if (isErr) Red else Stroke, RoundedCornerShape(16.dp)).padding(16.dp)) {
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text(event.type.uppercase(), style = MaterialTheme.typography.titleLarge, color = if (isErr) Red else TextPrimary)
                                  Text(plant?.name ?: "Неизвестно", color = Lime)
                              }
                              Text(LocalDateTime.parse(event.dateTime).format(formatter), style = MaterialTheme.typography.labelSmall, color = TextSecondary)
                              if (event.inPpm != null || event.outPpm != null) {
                                  Spacer(Modifier.height(8.dp))
                                  Text("PPM: ${event.inPpm ?: "-"} → ${event.outPpm ?: "-"} ${if (d != null) "(Δ $d)" else ""}", color = TextSecondary)
                              }
                              if (!event.note.isNullOrBlank()) {
                                  Spacer(Modifier.height(4.dp))
                                  Text(event.note, color = TextPrimary)
                              }
                          }
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/growtracker/app/ui/screens/CalendarScreen.kt
          package com.growtracker.app.ui.screens
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.growtracker.app.ui.MainViewModel
          import com.growtracker.app.ui.theme.*
          import java.time.LocalDate
          import java.time.LocalDateTime
          import java.time.YearMonth
          import java.time.format.DateTimeFormatter
          import java.util.Locale
          @Composable
          fun CalendarScreen(viewModel: MainViewModel) {
              val events by viewModel.events.collectAsState()
              val plants by viewModel.plants.collectAsState()
              var currentMonth by remember { mutableStateOf(YearMonth.now()) }
              var selectedDate by remember { mutableStateOf(LocalDate.now()) }

              Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  Text("КАЛЕНДАРЬ", style = MaterialTheme.typography.displayLarge, color = Lime)
                  Spacer(Modifier.height(16.dp))

                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onClick = { currentMonth = currentMonth.minusMonths(1) }) {
                          Text("<", color = Lime, fontSize = 24.sp, fontWeight = androidx.compose.ui.text.font.FontWeight.Bold)
                      }
                      Text(
                          currentMonth.format(DateTimeFormatter.ofPattern("LLLL yyyy", Locale("ru"))).uppercase(Locale("ru")),
                          style = MaterialTheme.typography.titleLarge, color = TextPrimary
                      )
                      IconButton(onClick = { currentMonth = currentMonth.plusMonths(1) }) {
                          Text(">", color = Lime, fontSize = 24.sp, fontWeight = androidx.compose.ui.text.font.FontWeight.Bold)
                      }
                  }
                  Spacer(Modifier.height(16.dp))

                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceAround) {
                      listOf("Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс").forEach {
                          Text(it, color = TextSecondary, modifier = Modifier.width(36.dp), textAlign = TextAlign.Center, style = MaterialTheme.typography.labelSmall)
                      }
                  }
                  Spacer(Modifier.height(8.dp))

                  val firstDay = currentMonth.atDay(1).dayOfWeek.value 
                  val daysInMonth = currentMonth.lengthOfMonth()
                  var dayCounter = 1

                  for (week in 0..5) {
                      if (dayCounter > daysInMonth) break
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceAround) {
                          for (dayOfWeek in 1..7) {
                              if (week == 0 && dayOfWeek < firstDay) {
                                  Spacer(Modifier.width(36.dp).height(48.dp))
                              } else if (dayCounter <= daysInMonth) {
                                  val date = currentMonth.atDay(dayCounter)
                                  val isSelected = date == selectedDate
                                  val hasEvents = events.any { LocalDateTime.parse(it.dateTime).toLocalDate() == date }
                                  
                                  Box(
                                      modifier = Modifier.width(36.dp).height(48.dp).clickable { selectedDate = date },
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Box(
                                              modifier = Modifier.size(32.dp).background(if (isSelected) Lime else Color.Transparent, CircleShape),
                                              contentAlignment = Alignment.Center
                                          ) {
                                              Text(
                                                  text = dayCounter.toString(),
                                                  color = if (isSelected) OnLime else TextPrimary,
                                                  style = MaterialTheme.typography.bodyMedium
                                              )
                                          }
                                          Spacer(Modifier.height(4.dp))
                                          if (hasEvents) {
                                              Box(Modifier.size(4.dp).background(if (isSelected) OnLime else Lime, CircleShape))
                                          } else {
                                              Spacer(Modifier.height(4.dp))
                                          }
                                      }
                                  }
                                  dayCounter++
                              } else {
                                  Spacer(Modifier.width(36.dp).height(48.dp))
                              }
                          }
                      }
                  }

                  Spacer(Modifier.height(16.dp))
                  Box(Modifier.fillMaxWidth().height(1.dp).background(Stroke))
                  Spacer(Modifier.height(16.dp))

                  val dayEvents = events.filter { LocalDateTime.parse(it.dateTime).toLocalDate() == selectedDate }
                  if (dayEvents.isEmpty()) {
                      Text("Нет событий в этот день", color = TextSecondary)
                  } else {
                      LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          items(dayEvents) { ev ->
                              val plant = plants.find { it.id == ev.plantId }
                              Row(Modifier.fillMaxWidth().background(Surface, RoundedCornerShape(12.dp)).padding(12.dp)) {
                                  Column(Modifier.weight(1f)) {
                                      Text(ev.type.uppercase(), color = Lime, style = MaterialTheme.typography.labelSmall)
                                      Text(plant?.name ?: "", color = TextPrimary, style = MaterialTheme.typography.titleLarge)
                                      if (!ev.note.isNullOrBlank()) Text(ev.note, color = TextSecondary, style = MaterialTheme.typography.bodyMedium)
                                  }
                                  Text(LocalDateTime.parse(ev.dateTime).format(DateTimeFormatter.ofPattern("HH:mm")), color = TextSecondary)
                              }
                          }
                      }
                  }
              }
          }
          EOF

