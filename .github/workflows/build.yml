          val BgGlow = Color(0x2EB4F000)
          val Surface = Color(0xFF1E1E1E)
          val Surface2 = Color(0xFF262626)
          val Stroke = Color(0xFF333333)
          val TextPrimary = Color(0xFFFFFFFF)
          val TextSecondary = Color(0xFF8C8C8C)
