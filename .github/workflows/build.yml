              var outPpm by remember { mutableStateOf("") }
              var note by remember { mutableStateOf("") }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("ДОБАВИТЬ СОБЫТИЕ") },
                  text = {
                      Column {
                          OutlinedTextField(value = inPpm, onValueChange = { inPpm = it }, label = { Text("Вход PPM") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number))
                          Spacer(Modifier.height(8.dp))
                          OutlinedTextField(value = outPpm, onValueChange = { outPpm = it }, label = { Text("Выход PPM") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number))
